<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 700 680" width="700" height="680" role="img" aria-labelledby="t d">
<title id="t">Four back-office tools</title>
<desc id="d">A schematic: four kinds of repeat work in a broker's ticket queue, each with an arrow to the internal tool that took it over.</desc>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d2dc63"/></marker>
</defs>
<g font-family="Instrument Sans, ui-sans-serif, system-ui, 'Segoe UI', Roboto, sans-serif">
  <text x="24" y="92" font-size="18" letter-spacing="3" fill="#a79f8f">THE QUEUE</text>
  <text x="364" y="92" font-size="18" letter-spacing="3" fill="#a79f8f">THE TOOL</text>

  <g>
    <rect x="24" y="130" width="300" height="104" rx="14" fill="#2c251c"/>
    <text x="42" y="176" font-size="24" fill="#f1ecdd">Cancel an order</text>
    <text x="42" y="210" font-size="18" fill="#a79f8f">the same steps, every time</text>
    <line x1="330" y1="182" x2="356" y2="182" stroke="#d2dc63" stroke-width="4" marker-end="url(#a)"/>
    <rect x="364" y="130" width="312" height="104" rx="14" fill="none" stroke="#d2dc63" stroke-width="3"/>
    <text x="382" y="176" font-size="24" fill="#f1ecdd">Cancellation system</text>
    <text x="382" y="210" font-size="18" fill="#d2dc63">one process, one record</text>
  </g>
  <g>
    <rect x="24" y="280" width="300" height="104" rx="14" fill="#2c251c"/>
    <text x="42" y="326" font-size="24" fill="#f1ecdd">Invoice to accounts</text>
    <text x="42" y="360" font-size="18" fill="#a79f8f">retyped by hand</text>
    <line x1="330" y1="332" x2="356" y2="332" stroke="#d2dc63" stroke-width="4" marker-end="url(#a)"/>
    <rect x="364" y="280" width="312" height="104" rx="14" fill="none" stroke="#d2dc63" stroke-width="3"/>
    <text x="382" y="326" font-size="24" fill="#f1ecdd">Invoicing bridge</text>
    <text x="382" y="360" font-size="18" fill="#d2dc63">no retyping, fewer mistakes</text>
  </g>
  <g>
    <rect x="24" y="430" width="300" height="104" rx="14" fill="#2c251c"/>
    <text x="42" y="476" font-size="24" fill="#f1ecdd">Image for the website</text>
    <text x="42" y="510" font-size="18" fill="#a79f8f">a ticket, then a wait</text>
    <line x1="330" y1="482" x2="356" y2="482" stroke="#d2dc63" stroke-width="4" marker-end="url(#a)"/>
    <rect x="364" y="430" width="312" height="104" rx="14" fill="none" stroke="#d2dc63" stroke-width="3"/>
    <text x="382" y="476" font-size="24" fill="#f1ecdd">Image uploader</text>
    <text x="382" y="510" font-size="18" fill="#d2dc63">marketing publishes it</text>
  </g>
  <g>
    <rect x="24" y="580" width="300" height="104" rx="14" fill="#2c251c"/>
    <text x="42" y="626" font-size="24" fill="#f1ecdd">Platform order</text>
    <text x="42" y="660" font-size="18" fill="#a79f8f">check it, track it, fix it</text>
    <line x1="330" y1="632" x2="356" y2="632" stroke="#d2dc63" stroke-width="4" marker-end="url(#a)"/>
    <rect x="364" y="580" width="312" height="104" rx="14" fill="none" stroke="#d2dc63" stroke-width="3"/>
    <text x="382" y="626" font-size="24" fill="#f1ecdd">Order integration</text>
    <text x="382" y="660" font-size="18" fill="#d2dc63">215 orders, 176 reconciled</text>
  </g>
</g>
</svg>
