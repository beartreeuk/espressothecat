<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 60 1400 680" width="1400" height="680" role="img" aria-labelledby="t d">
<title id="t">Four back-office tools</title>
<desc id="d">A schematic: four kinds of repeat work in a broker's ticket queue, each with an arrow to the internal tool that took it over.</desc>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d2dc63"/></marker>
</defs>
<g font-family="Instrument Sans, ui-sans-serif, system-ui, 'Segoe UI', Roboto, sans-serif">
  <text x="280" y="140" font-size="24" letter-spacing="4" fill="#a79f8f">THE QUEUE, EVERY DAY</text>
  <text x="820" y="140" font-size="24" letter-spacing="4" fill="#a79f8f">THE TOOL THAT TOOK IT</text>

  <g>
    <rect x="280" y="180" width="400" height="96" rx="16" fill="#2c251c"/>
    <text x="308" y="222" font-size="30" fill="#f1ecdd">Cancel an order</text>
    <text x="308" y="257" font-size="22" fill="#a79f8f">the same steps, every time</text>
    <line x1="692" y1="228" x2="806" y2="228" stroke="#d2dc63" stroke-width="4" marker-end="url(#a)"/>
    <rect x="820" y="180" width="400" height="96" rx="16" fill="none" stroke="#d2dc63" stroke-width="3"/>
    <text x="848" y="222" font-size="30" fill="#f1ecdd">Cancellation system</text>
    <text x="848" y="257" font-size="22" fill="#d2dc63">one process, one record</text>
  </g>
  <g>
    <rect x="280" y="310" width="400" height="96" rx="16" fill="#2c251c"/>
    <text x="308" y="352" font-size="30" fill="#f1ecdd">Invoice to accounts</text>
    <text x="308" y="387" font-size="22" fill="#a79f8f">retyped by hand</text>
    <line x1="692" y1="358" x2="806" y2="358" stroke="#d2dc63" stroke-width="4" marker-end="url(#a)"/>
    <rect x="820" y="310" width="400" height="96" rx="16" fill="none" stroke="#d2dc63" stroke-width="3"/>
    <text x="848" y="352" font-size="30" fill="#f1ecdd">Invoicing bridge</text>
    <text x="848" y="387" font-size="22" fill="#d2dc63">no retyping, fewer mistakes</text>
  </g>
  <g>
    <rect x="280" y="440" width="400" height="96" rx="16" fill="#2c251c"/>
    <text x="308" y="482" font-size="30" fill="#f1ecdd">Image for the website</text>
    <text x="308" y="517" font-size="22" fill="#a79f8f">a ticket, then a wait</text>
    <line x1="692" y1="488" x2="806" y2="488" stroke="#d2dc63" stroke-width="4" marker-end="url(#a)"/>
    <rect x="820" y="440" width="400" height="96" rx="16" fill="none" stroke="#d2dc63" stroke-width="3"/>
    <text x="848" y="482" font-size="30" fill="#f1ecdd">Image uploader</text>
    <text x="848" y="517" font-size="22" fill="#d2dc63">marketing publishes it themselves</text>
  </g>
  <g>
    <rect x="280" y="570" width="400" height="96" rx="16" fill="#2c251c"/>
    <text x="308" y="612" font-size="30" fill="#f1ecdd">Platform order</text>
    <text x="308" y="647" font-size="22" fill="#a79f8f">check it, track it, fix it</text>
    <line x1="692" y1="618" x2="806" y2="618" stroke="#d2dc63" stroke-width="4" marker-end="url(#a)"/>
    <rect x="820" y="570" width="400" height="96" rx="16" fill="none" stroke="#d2dc63" stroke-width="3"/>
    <text x="848" y="612" font-size="30" fill="#f1ecdd">Order integration</text>
    <text x="848" y="647" font-size="22" fill="#d2dc63">215 orders, 176 reconciled</text>
  </g>
</g>
</svg>
